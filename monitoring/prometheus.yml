global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "healthcare-readmission-monitor"

scrape_configs:
  - job_name: "readmission-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: "readmission-risk-api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
